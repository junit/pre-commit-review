[package]
name = "collect-diff-context-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
autobins = false

[features]
test-fixture = []
sqlite-storage-spike = []

[[bin]]
name = "collect-diff-context-cli"
path = "src/main.rs"

[[bin]]
name = "static-analysis-cli"
path = "src/bin/static_analysis.rs"

[[bin]]
name = "repository-context-cli"
path = "src/bin/repository_context.rs"

[[bin]]
name = "static-analysis-fixture"
path = "src/bin/static_analysis_fixture.rs"
required-features = ["test-fixture"]

[[bin]]
name = "sqlite-storage-spike"
path = "src/bin/sqlite_storage_spike.rs"
required-features = ["sqlite-storage-spike"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
sha2 = "0.10"
tempfile = "3"
percent-encoding = "2"
tree-sitter = "=0.26.11"
tree-sitter-rust = "=0.24.2"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
toml = { version = "=1.1.3", default-features = false, features = ["std", "serde", "parse"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "impact_context"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

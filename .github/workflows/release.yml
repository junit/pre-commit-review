name: Release Multi-Platform Packs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_only:
        description: Run build and pack verification without creating a release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-packs:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-amd64
            use_musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux)
        if: matrix.use_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        run: cargo +1.95.0 build --release --locked --target ${{ matrix.target }} --bins
        working-directory: collect-diff-context-cli

      - name: Prepare platform-owned binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist scripts/bin
          suffix=''
          if [ "${{ matrix.platform }}" = 'windows-amd64' ]; then
            suffix='.exe'
          fi
          cp "collect-diff-context-cli/target/${{ matrix.target }}/release/collect-diff-context-cli${suffix}" \
            "scripts/bin/collect_diff_context-${{ matrix.platform }}${suffix}"
          cp "collect-diff-context-cli/target/${{ matrix.target }}/release/static-analysis-cli${suffix}" \
            "scripts/bin/static_analysis-${{ matrix.platform }}${suffix}"
          cp "collect-diff-context-cli/target/${{ matrix.target }}/release/repository-context-cli${suffix}" \
            "scripts/bin/repository_context-${{ matrix.platform }}${suffix}"
          cp "collect-diff-context-cli/target/${{ matrix.target }}/release/repository-context-provider-cli${suffix}" \
            "scripts/bin/repository_context_provider-${{ matrix.platform }}${suffix}"
          scripts/bin/static_analysis-${{ matrix.platform }}${suffix} collect --help
          scripts/bin/repository_context-${{ matrix.platform }}${suffix} collect --help
          scripts/bin/repository_context_provider-${{ matrix.platform }}${suffix} --help
          if find scripts/bin -type f -name 'rust-analyzer*' -print -quit | grep -q .; then
            echo 'Core payload unexpectedly contains rust-analyzer' >&2
            exit 1
          fi

      - name: Fetch reviewed Gitleaks input
        shell: bash
        run: ./scripts/fetch_gitleaks.sh --platform "${{ matrix.platform }}" --dest dist

      - name: Build normalized Gitleaks pack
        shell: bash
        run: |
          set -euo pipefail
          suffix=''
          writer="collect-diff-context-cli/target/${{ matrix.target }}/release/artifact-pack-writer"
          if [ "${{ matrix.platform }}" = 'windows-amd64' ]; then
            suffix='.exe'
            writer="${writer}.exe"
          fi
          PRE_COMMIT_REVIEW_PACK_WRITER="$PWD/$writer" \
            ./scripts/build_artifact_pack.sh \
              --kind gitleaks \
              --platform-id "${{ matrix.platform }}" \
              --pack-version 8.30.1-pcr.1 \
              --source-root "$PWD" \
              --manifest "$PWD/third_party_artifacts/manifest.json" \
              --source-lock "$PWD/third_party_artifacts/sources/gitleaks-8.30.1.json" \
              --binary "$PWD/dist/gitleaks-${{ matrix.platform }}${suffix}" \
              --output "$PWD/dist/pre-commit-review-gitleaks-8.30.1-pcr.1-${{ matrix.platform }}.tar.gz" \
              --record-output "$PWD/dist/gitleaks-${{ matrix.platform }}.record.json" \
              --manifest-output "$PWD/dist/manifest-${{ matrix.platform }}.json"

      - name: Build platform core pack
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            core_version="${GITHUB_REF_NAME#v}"
          else
            core_version="0.1.0-dev.${GITHUB_RUN_ID}"
          fi
          writer="collect-diff-context-cli/target/${{ matrix.target }}/release/artifact-pack-writer"
          if [ "${{ matrix.platform }}" = 'windows-amd64' ]; then
            writer="${writer}.exe"
          fi
          PRE_COMMIT_REVIEW_PACK_WRITER="$PWD/$writer" \
            ./scripts/build_artifact_pack.sh \
              --kind core \
              --platform-id "${{ matrix.platform }}" \
              --pack-version "$core_version" \
              --source-root "$PWD" \
              --manifest "$PWD/dist/manifest-${{ matrix.platform }}.json" \
              --revocations "$PWD/third_party_artifacts/revocations.json" \
              --output "$PWD/dist/pre-commit-review-core-${core_version}-${{ matrix.platform }}.tar.gz" \
              --record-output "$PWD/dist/core-${{ matrix.platform }}.record.json"

      - name: Upload platform packs
        uses: actions/upload-artifact@v4
        with:
          name: release-packs-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.record.json
            dist/manifest-${{ matrix.platform }}.json

  create-release:
    name: Create GitHub Release
    needs: build-packs
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_only != true)
    steps:
      - name: Download platform packs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Gitleaks artifact release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: artifact-gitleaks-8.30.1-pcr.1
          files: |
            artifacts/**/pre-commit-review-gitleaks-*.tar.gz
            artifacts/**/gitleaks-*.record.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create project core release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/pre-commit-review-core-*.tar.gz
            artifacts/**/core-*.record.json
            artifacts/**/manifest-*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
